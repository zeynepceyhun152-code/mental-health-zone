<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Reset password · The Mental Health Zone</title>
<link rel="icon" href="/images/cover.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gilda+Display&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css">
<link rel="stylesheet" href="/css/portal.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>
</head>
<body class="p-body">
<header class="p-top"><div class="p-top-in">
<a class="p-brand" href="/"><img src="/images/cover.png" alt="">The Mental Health Zone</a>
<a class="p-link" href="/">Back to site</a>
</div></header>
<main class="p-narrow">
<h1 class="p-h1">Set a new password</h1>
<form id="f" class="card">
<label class="f">New password<input type="password" id="pw" minlength="8" autocomplete="new-password" required></label>
<label class="f">Confirm password<input type="password" id="pw2" minlength="8" autocomplete="new-password" required></label>
<button class="btn" id="go" type="submit">Save password</button>
<p class="msg" data-msg id="msg" role="status"></p>
</form>
</main>
<script>
const msg = document.getElementById("msg");
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (pw.value !== pw2.value) return mhz.show(msg, "The passwords don't match.");
  const { data } = await sb.auth.getSession();
  if (!data.session) return mhz.show(msg, "This link has expired. Go to Sign in and click \"Forgot password?\" again.");
  const { error } = await sb.auth.updateUser({ password: pw.value });
  if (error) return mhz.show(msg, error.message);
  mhz.show(msg, "Saved! Taking you to your portal…", true);
  setTimeout(() => (location.href = "/portal.html"), 900);
});
</script>
</body>
</html>
